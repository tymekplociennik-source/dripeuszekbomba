name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "DripeuszekBomba-src (1)/DripeuszekBomba"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
          build-root-directory: "DripeuszekBomba-src (1)/DripeuszekBomba"

      - name: Build
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: DripeuszekBomba
          path: "DripeuszekBomba-src (1)/DripeuszekBomba/build/libs/*.jar"
